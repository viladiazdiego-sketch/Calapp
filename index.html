function updateStatsAndChart() {
    const allDates = Object.keys(appData.dailyLogs).sort();
    if (allDates.length === 0) {
        document.getElementById('statsPanel').innerHTML = '<div class="insight-card"><span class="insight-lab">Total ingerido</span><span class="insight-val">0</span></div><div class="insight-card"><span class="insight-lab">Balance medio</span><span class="insight-val">0</span></div>';
        return;
    }
    let totalIngested = 0;
    let balances = [];
    for (let date of allDates) {
        let ing = calcDayIngested(date);
        totalIngested += ing;
        balances.push(calcDayBalance(date));
    }
    let avgBalance = balances.reduce((a,b) => a+b, 0) / balances.length;
    document.getElementById('statsPanel').innerHTML = '<div class="insight-card"><span class="insight-lab">Total ingerido</span><span class="insight-val" style="color:var(--text-primary);">' + Math.round(totalIngested) + '</span></div><div class="insight-card"><span class="insight-lab">Balance medio</span><span class="insight-val" style="color:var(--accent);">' + Math.round(avgBalance) + '</span></div>';
    const canvas = document.getElementById('historyChartCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    let labels = [], values = [];
    if (historyMode === 'dia') {
        let last7 = allDates.slice(-7);
        labels = last7.map(d => d.slice(5).replace('-','/'));
        values = last7.map(d => calcDayBalance(d));
    } else {
        let monthMap = new Map();
        for (let date of allDates) {
            let y = date.slice(0,4);
            let m = date.slice(5,7);
            let key = y + '-' + m;
            let balance = calcDayBalance(date);
            monthMap.set(key, (monthMap.get(key)||0) + balance);
        }
        let sortedMonths = Array.from(monthMap.keys()).sort().slice(-6);
        labels = sortedMonths.map(k => k.slice(5)+'/'+k.slice(2,4));
        values = sortedMonths.map(k => monthMap.get(k));
    }
    
    const isDark = !document.body.classList.contains('light-mode');
    const gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
    const textColor = isDark ? '#a0a0b5' : '#606075';

    if (historyChart) {
        historyChart.data.labels = labels;
        historyChart.data.datasets[0].data = values;
        historyChart.options.scales.x.ticks.color = textColor;
        historyChart.options.scales.y.ticks.color = textColor;
        historyChart.options.scales.y.grid.color = gridColor;
        historyChart.update('none');
    } else {
        historyChart = new Chart(ctx, {
        type: 'line',
        data: { 
            labels: labels, 
            datasets: [{ 
                label: 'Balance (kcal)', 
                data: values, 
                borderColor: '#7C3AED', 
                backgroundColor: 'rgba(124, 58, 237, 0.15)', 
                borderWidth: 3,
                tension: 0.4, 
                fill: true,
                pointBackgroundColor: '#7C3AED',
                pointBorderColor: isDark ? '#101018' : '#ffffff',
                pointBorderWidth: 2,
                pointRadius: 4
            }] 
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { display: false }, ticks: { color: textColor, font: { family: 'system-ui', weight: 600 } } },
                y: { grid: { color: gridColor }, ticks: { color: textColor, font: { family: 'system-ui', weight: 600 } } }
            }
        }
    });
}
}

function renderRadarOlvidados() {
    const limitDate = new Date(); 
    limitDate.setDate(limitDate.getDate() - 30);
    const forgotten = appData.foods.filter(food => {
        let usedRecently = false;
        for (let [date, log] of Object.entries(appData.dailyLogs)) {
            if (new Date(date) < limitDate) continue;
            for (let meal of Object.values(log.meals)) {
                if (meal.some(item => item.foodId === food.id)) { 
                    usedRecently = true; 
                    break; 
                }
            }
            if (usedRecently) break;
        }
        return !usedRecently;
    });
    const radarDiv = document.getElementById('staleRadar');
    if (forgotten.length === 0) radarDiv.innerHTML = '<span style="color:var(--success); font-weight:700;">✅ ¡Todos los alimentos se han usado en los últimos 30 días!</span>';
    else radarDiv.innerHTML = '<span style="color:var(--warning); font-weight:800;">⚠️ Olvidados (+30 días):</span><br><span style="color:var(--text-secondary);">' + forgotten.slice(0,5).map(f=>f.name).join(', ') + (forgotten.length>5 ? '...' : '') + '</span>';
}

function renderHistoryList() {
    const container = document.getElementById('historyListContainer');
    if (!container) return;
    
    let groups = new Map();
    for (let [date, log] of Object.entries(appData.dailyLogs)) {
        let hasAnyFood = false;
        for (let meal of Object.values(log.meals)) {
            if (meal.length > 0) {
                hasAnyFood = true;
                break;
            }
        }
        let hasAnyExercise = log.exercises.length > 0;
        if (!hasAnyFood && !hasAnyExercise) continue;
        
        let key, label, dateObj = new Date(date + 'T00:00:00');
        
        if (historyMode === 'dia') {
            key = date;
            label = formatDateShort(date);
        } else {
            key = dateObj.getFullYear() + '-' + (dateObj.getMonth() + 1);
            label = dateObj.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }).toUpperCase();
        }
        
        if (!groups.has(key)) groups.set(key, { label: label, dateObj: dateObj, items: [] });
        groups.get(key).items.push({ date: date, ingested: calcDayIngested(date), log: log });
    }
    
    let sortedGroups = Array.from(groups.values()).sort((a,b) => b.dateObj - a.dateObj);
    if (sortedGroups.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>No hay registros aún</p></div>';
        return;
    }
    
    let html = '';
    const goal = appData.goalCalories;
    
    for (let group of sortedGroups) {
        if (historyMode === 'dia') {
            let totalIngested = group.items.reduce((s, i) => s + i.ingested, 0);
            let uniqueProducts = new Set();
            for (let item of group.items) {
                for (let meal of Object.values(item.log.meals)) {
                    for (let foodItem of meal) {
                        const food = appData.foods.find(f => f.id === foodItem.foodId);
                        uniqueProducts.add(food ? food.name : '?');
                    }
                }
            }
            let productCount = uniqueProducts.size;
            let isOverGoal = totalIngested > goal;
            let kcalColor = isOverGoal ? 'var(--danger)' : 'var(--success)';
            let kcalBg = isOverGoal ? 'rgba(239,68,68,0.15)' : 'rgba(16,185,129,0.15)';
            
            html += '<div class="log-group"><div class="log-header"><div><b style="font-size:1.15rem; letter-spacing:-0.5px;">' + group.label + '</b><div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px; font-weight:600;">🍽️ ' + productCount + ' ' + (productCount === 1 ? 'producto' : 'productos') + '</div></div><div class="align-right-fix"><span style="background:' + kcalBg + '; color:' + kcalColor + '; padding:6px 16px; border-radius:40px; font-size:0.9rem; font-weight:800; border:1px solid ' + kcalColor + '40;">' + Math.round(totalIngested) + ' kcal</span><div class="log-arrow">▼</div></div></div><div class="log-details">';
            
            for (let item of group.items) {
                html += '<div style="margin-bottom: 16px; padding-bottom: 4px;">';
                html += renderGroupedMeals(item.log.meals);
                html += renderGroupedExercises(item.log.exercises);
                html += '</div>';
            }
            html += '</div></div>';
            
        } else {
            let totalMonthIngested = group.items.reduce((s, i) => s + i.ingested, 0);
            let daysInMonth = group.items.length;
            let avgDaily = totalMonthIngested / daysInMonth;
            let isOverGoal = avgDaily > goal;
            let kcalColor = isOverGoal ? 'var(--danger)' : 'var(--success)';
            let kcalBg = isOverGoal ? 'rgba(239,68,68,0.15)' : 'rgba(16,185,129,0.15)';
            
            html += '<div class="log-group"><div class="log-header"><div><b style="font-size:1.15rem; letter-spacing:-0.5px;">' + group.label + '</b><div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px; font-weight:600;">📅 ' + daysInMonth + ' día(s)</div></div><div class="align-right-fix"><span style="background:' + kcalBg + '; color:' + kcalColor + '; padding:6px 16px; border-radius:40px; font-size:0.9rem; font-weight:800; border:1px solid ' + kcalColor + '40;">' + Math.round(totalMonthIngested) + ' kcal</span><div class="log-arrow">▼</div></div></div><div class="log-details">';
            
            let sortedDays = group.items.sort((a,b) => new Date(b.date) - new Date(a.date));
            for (let item of sortedDays) {
                let dayIngested = item.ingested;
                let dayColor = dayIngested > goal ? 'var(--danger)' : 'var(--success)';
                let uniqueProductsDay = new Set();
                for (let meal of Object.values(item.log.meals)) {
                    for (let foodItem of meal) {
                        const food = appData.foods.find(f => f.id === foodItem.foodId);
                        uniqueProductsDay.add(food ? food.name : '?');
                    }
                }
                
                html += '<div class="sub-day-group"><div class="sub-day-header"><div><b style="font-size:1.05rem;">' + formatDateShort(item.date) + '</b><div style="font-size:0.7rem; color:var(--text-muted); font-weight:600; margin-top:2px;">🍽️ ' + uniqueProductsDay.size + ' ' + (uniqueProductsDay.size === 1 ? 'producto' : 'productos') + '</div></div><div class="align-right-fix"><span style="color:' + dayColor + '; font-weight:800; font-size:0.95rem;">' + Math.round(dayIngested) + ' kcal</span><span class="sub-day-arrow">▼</span></div></div><div class="sub-day-details">' + renderGroupedMeals(item.log.meals) + renderGroupedExercises(item.log.exercises) + '</div></div>';
            }
            html += '</div></div>';
        }
    }
    container.innerHTML = html;
    
    document.querySelectorAll('.log-group').forEach(group => {
        const header = group.querySelector('.log-header');
        const details = group.querySelector('.log-details');
        const arrow = group.querySelector('.log-arrow');
        if (header && !header.hasAttribute('data-initialized')) {
            header.setAttribute('data-initialized', 'true');
            header.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = group.classList.contains('open');
if (arrow) arrow.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
group.classList.toggle('open');
            });
        }
    });
    
    document.querySelectorAll('.sub-log-group').forEach(group => {
        const header = group.querySelector('.sub-log-header');
        const details = group.querySelector('.sub-log-details');
        const arrow = group.querySelector('.sub-log-arrow');
        if (header && !header.hasAttribute('data-initialized')) {
            header.setAttribute('data-initialized', 'true');
            header.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = group.classList.contains('open');
if (arrow) arrow.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
group.classList.toggle('open');
            });
        }
    });
    
    document.querySelectorAll('.sub-day-group').forEach(group => {
        const header = group.querySelector('.sub-day-header');
        const details = group.querySelector('.sub-day-details');
        const arrow = group.querySelector('.sub-day-arrow');
        if (header && !header.hasAttribute('data-initialized')) {
            header.setAttribute('data-initialized', 'true');
            header.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = group.classList.contains('open');
if (arrow) arrow.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
group.classList.toggle('open');
            });
        }
    });
}

    // ============ TOAST & UTILS ============
    function showToast(msg) {
        var container = document.getElementById('toastContainer');
        if (!container) return;
        var toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        container.appendChild(toast);
        setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 2500);
    }
    window.alert = showToast;

    // Ripple effect
    document.addEventListener('pointerdown', function(e) {
        var target = e.target.closest('.card, .btn');
        if (!target) return;
        var rect = target.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        target.style.setProperty('--ripple-x', x + 'px');
        target.style.setProperty('--ripple-y', y + 'px');
        target.classList.add('ripple-active');
        setTimeout(function() { target.classList.remove('ripple-active'); }, 400);
    });

    // ============ INITIALIZATION ============
    loadData();

    if (!appData.onboarded) {
        document.getElementById('screen-onboarding').classList.add('active');
        document.querySelectorAll('.screen:not(#screen-onboarding)').forEach(function(s) { s.classList.remove('active'); });
        document.getElementById('bottomNav').style.display = 'none';
    } else {
        document.getElementById('screen-onboarding').classList.remove('active');
        document.getElementById('screen-onboarding').style.display = 'none';
        document.getElementById('bottomNav').style.display = 'flex';
        setTimeout(function() { showScreen('dashboard'); renderDashboard(); }, 100);
    }

    setInterval(function() {
    var now = new Date();
    var hour = now.getHours();
    var realToday = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    // Si pasan de las 5 y aún no se había confirmado, forzar cambio automático
    if (hour >= 5 && appData.nightConfirmed !== realToday && document.getElementById('nightBanner')) {
        confirmNightChange();
    }
    if (document.getElementById('screen-dashboard').classList.contains('active')) renderDashboard();
}, 60000);

    setTimeout(function() { initTheme(); }, 200);
    console.log('🔥 Caloria app initialized successfully!');
})();
</script>
</body>
</html>
